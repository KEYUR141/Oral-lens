[project]
name = "oral-lens"
version = "0.1.0"
description = "Oral cancer literature research workspace and corpus inspection backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9,<3",
    "pgvector>=0.3,<1",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ml = ["sentence-transformers==6.2.0", "pymupdf==2.0", "pillow==13.0.0"]
legacy = ["google-genai==2.33.0"]
visualization = ["umap-learn==0.5.12", "scikit-learn==1.9.1", "joblib==1.6.0"]

[tool.uv]
package = false
default-groups = ["dev", "ml", "legacy", "visualization"]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
